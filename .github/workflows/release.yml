name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: EmulationScreenServer/EmulationScreenServer.csproj

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      DOTNET_FRAMEWORK: net10.0-windows
      DOTNET_RUNTIME: win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$PROJECT_PATH" \
            --configuration Release \
            --framework "$DOTNET_FRAMEWORK" \
            -p:TargetFrameworks="$DOTNET_FRAMEWORK" \
            --runtime "$DOTNET_RUNTIME" \
            --self-contained true \
            -p:PublishReadyToRun=true \
            --output ./artifacts/publish

      - name: Package
        shell: pwsh
        run: |
          $zip = "./artifacts/EmulationScreenServer-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path ./artifacts/publish/* -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmulationScreenServer-${{ github.ref_name }}-win-x64
          path: ./artifacts/EmulationScreenServer-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    env:
      DOTNET_FRAMEWORK: net10.0
      DOTNET_RUNTIME: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$PROJECT_PATH" \
            --configuration Release \
            --framework "$DOTNET_FRAMEWORK" \
            -p:TargetFrameworks="$DOTNET_FRAMEWORK" \
            --runtime "$DOTNET_RUNTIME" \
            --self-contained true \
            -p:PublishReadyToRun=true \
            --output ./artifacts/publish

      - name: Package
        run: |
          tar -czf "./artifacts/EmulationScreenServer-${{ github.ref_name }}-linux-x64.tar.gz" -C ./artifacts/publish .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmulationScreenServer-${{ github.ref_name }}-linux-x64
          path: ./artifacts/EmulationScreenServer-${{ github.ref_name }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EmulationScreenServer-${{ github.ref_name }}-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
